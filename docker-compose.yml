# docker-compose.yml
# Run the full stack locally with one command: docker-compose up

version: "3.9"

services:
  fraud-api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "8000:8000"        # host:container
    volumes:
      - ./models:/app/models          # so retrained models are picked up
      - ./data/processed:/app/data/processed
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3