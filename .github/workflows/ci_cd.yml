# .github/workflows/ci_cd.yml
# Runs automatically on every push to main branch

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — set up Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3 — install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      # Step 4 — create dummy model and data for tests
      # (real model/data files are in .gitignore so CI needs stubs)
      - name: Create test fixtures
        run: |
          mkdir -p models data/processed
          python - <<'EOF'
          import joblib, json, numpy as np
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression

          # Create a tiny dummy model so the API can load in CI
          features = [
              "step","amount","oldbalanceOrg","newbalanceOrig",
              "oldbalanceDest","newbalanceDest","type_encoded",
              "orig_balance_diff","dest_balance_diff",
              "orig_balance_zero","amount_to_balance_ratio","hour_of_day"
          ]
          X = np.random.rand(100, 12)
          y = np.random.randint(0, 2, 100)
          model = Pipeline([
              ("scaler", StandardScaler()),
              ("clf", LogisticRegression(max_iter=10))
          ])
          model.fit(X, y)
          joblib.dump(model, "models/best_model.pkl")
          with open("data/processed/feature_names.json", "w") as f:
              json.dump(features, f)
          print("Test fixtures created")
          EOF

      # Step 5 — run pytest
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      # Step 6 — build Docker image (confirms Dockerfile is valid)
      - name: Build Docker image
        run: |
          docker build -t fraud-detection-api:ci .

      - name: Confirm Docker image built
        run: |
          docker images fraud-detection-api:ci